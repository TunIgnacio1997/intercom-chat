<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Intercom</title>

  <script>

    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name) || '';
    }

    async function getJWT(user) {
      const res = await fetch("https://TU_WORKER.workers.dev", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          user_id: user.user_id,
          email: user.email
        })
      });

      const data = await res.json();
      return data.token;
    }

    async function bootIntercom() {

      const user = {
        user_id: getParam('user_id'),
        name: getParam('name'),
        email: getParam('email'),
        company_id: getParam('company_id'),
        company_name: getParam('company_name')
      };

      // cerrar sesión anterior
      if (window.Intercom) {
        Intercom('shutdown');
      }

      // 🔥 obtener JWT desde Worker
      const userHash = await getJWT(user);

      console.log("JWT:", userHash);

      Intercom('boot', {
        app_id: 's48z5ve1',

        user_id: user.user_id,
        name: user.name,
        email: user.email,

        // identity verification JWT
        intercom_user_jwt: userHash,

        company: {
          id: user.company_id,
          name: user.company_name
        }
      });

      Intercom('show');
    }

    (function () {

      var w = window;
      var ic = w.Intercom;

      if (typeof ic === "function") {

        ic('reattach_activator');
        ic('update', {});
        bootIntercom();

      } else {

        var d = document;

        var i = function () { i.c(arguments); };
        i.q = [];
        i.c = function (args) { i.q.push(args); };

        w.Intercom = i;

        function l() {
          var s = d.createElement('script');
          s.type = 'text/javascript';
          s.async = true;

          s.src = 'https://widget.intercom.io/widget/s48z5ve1';

          s.onload = bootIntercom;

          var x = d.getElementsByTagName('script')[0];
          x.parentNode.insertBefore(s, x);
        }

        if (document.readyState === 'complete') {
          l();
        } else {
          w.addEventListener('load', l, false);
        }
      }

    })();

  </script>

</head>

<body>
  <h2>Chat XL SOLAR</h2>
</body>
</html>
